[package]
name = "sp1-settlement-smoke-script"
version = "0.1.0"
edition = "2021"
default-run = "sp1-settlement-smoke"

[[bin]]
name = "sp1-settlement-smoke"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sp1-sdk = { version = "6.1.0", features = ["blocking"] }
sp1-settlement-smoke-lib = { path = "../lib" }

[build-dependencies]
sp1-build = { version = "6.1.0" }
