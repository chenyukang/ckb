[package]
name = "dao-treasury-tally-service"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
blake2b-ref = "0.3"
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.35", features = ["macros", "net", "rt-multi-thread"] }
