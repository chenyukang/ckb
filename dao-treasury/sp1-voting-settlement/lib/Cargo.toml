[package]
name = "sp1-voting-settlement-lib"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
ckb-commitments = ["dep:ckb-jsonrpc-types", "dep:ckb-types"]

[dependencies]
anyhow = "1"
blake2b-ref = "0.3"
ckb-jsonrpc-types = { path = "../../../util/jsonrpc-types", optional = true }
ckb-types = { path = "../../../util/types", optional = true }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
